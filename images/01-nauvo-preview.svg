<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid-nauvo" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f4f4f5" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background with subtle technical grid -->
  <rect width="1200" height="460" fill="#fafafa"/>
  <rect width="1200" height="460" fill="url(#grid-nauvo)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="38" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="20" cy="19" r="4.5" fill="#d4d4d8"/>
  <circle cx="36" cy="19" r="4.5" fill="#d4d4d8"/>
  <circle cx="52" cy="19" r="4.5" fill="#d4d4d8"/>
  
  <!-- Address Bar -->
  <rect x="80" y="8" width="420" height="22" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="96" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">nauvo.ai / engine / audit-report-0926</text>
  <text x="1110" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">TRL-4 PROD</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="422" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="24" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#09090b">NAUVO</text>
  <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa" letter-spacing="0.5">DETERMINISTIC INFERENCE</text>

  <!-- Sidebar Nav items -->
  <rect x="14" y="112" width="192" height="30" rx="4" fill="#e4e4e7"/>
  <text x="28" y="132" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#09090b">01. Causal Graph (DAG)</text>
  <text x="28" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">02. Macro Nodes</text>
  <text x="28" y="202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">03. Sensitivity Matrix</text>
  <text x="28" y="236" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">04. Liquidity &amp; Runway</text>
  <text x="28" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">05. Audit Logs</text>

  <rect x="14" y="380" width="192" height="60" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="26" y="402" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#09090b">ENGINE CALIBRATION</text>
  <text x="26" y="418" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Parsimony: 100% Valid</text>
  <text x="26" y="430" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Model: Compound DAG+LLM</text>

  <!-- Main Viewport -->
  <!-- Header Bar -->
  <g transform="translate(244, 56)">
    <text x="0" y="18" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#09090b">Inference Graph &amp; Liquidity Propagation</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">Entity extraction via LLM | Deterministic evaluation on acyclic causal graph</text>

    <rect x="800" y="4" width="130" height="26" rx="4" fill="#09090b"/>
    <text x="822" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ffffff">AUDIT REPORT</text>
  </g>

  <!-- DAG Diagram Canvas -->
  <g transform="translate(244, 114)">
    <!-- Canvas Frame -->
    <rect x="0" y="0" width="932" height="326" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Connecting Bezier Curves -->
    <path d="M 220 50 C 310 50, 310 130, 400 130" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 220 130 C 310 130, 310 130, 400 130" fill="none" stroke="#09090b" stroke-width="1.5"/>
    <path d="M 220 210 C 310 210, 310 130, 400 130" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <path d="M 590 130 C 640 130, 640 130, 690 130" fill="none" stroke="#09090b" stroke-width="2"/>

    <!-- Input Node 1: Team -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>
      <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">NODE 01: EQUIPO &amp; EJECUCIÓN</text>
      <text x="14" y="42" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#09090b">Strength: 87.2%</text>
      <circle cx="184" cy="28" r="4" fill="#09090b"/>
    </g>

    <!-- Input Node 2: Market -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>
      <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">NODE 02: MERCADO &amp; MOAT</text>
      <text x="14" y="42" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#09090b">Viability: 72.5%</text>
      <circle cx="184" cy="28" r="4" fill="#09090b"/>
    </g>

    <!-- Input Node 3: Traction & Runway -->
    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1"/>
      <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">NODE 03: TRACCIÓN &amp; CAJA</text>
      <text x="14" y="42" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#09090b">Runway: 4 Meses</text>
      <circle cx="184" cy="28" r="4" fill="#09090b"/>
    </g>

    <!-- Center DAG Engine Node -->
    <g transform="translate(400, 80)">
      <rect x="0" y="0" width="190" height="100" rx="8" fill="#f4f4f5" stroke="#09090b" stroke-width="1.5"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">CORE CAUSAL ENGINE</text>
      <text x="16" y="48" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#09090b">DAG Aggregation</text>
      <text x="16" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">Weighted Propagation</text>
      <rect x="16" y="78" width="158" height="6" rx="3" fill="#e4e4e7"/>
      <rect x="16" y="78" width="116" height="6" rx="3" fill="#09090b"/>
    </g>

    <!-- Final Verdict Card -->
    <g transform="translate(690, 45)">
      <rect x="0" y="0" width="222" height="170" rx="8" fill="#fafafa" stroke="#d4d4d8" stroke-width="1.5"/>
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#71717a">VEREDICTO FINAL</text>
      <text x="16" y="66" font-family="'IBM Plex Sans', sans-serif" font-size="36" font-weight="700" fill="#09090b">27.0</text>
      <text x="110" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">/ 100</text>
      <text x="16" y="86" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#09090b">BAJO RIESGO RELATIVO</text>
      <text x="16" y="104" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#52525b">Apto para Due Diligence</text>
      
      <line x1="16" y1="120" x2="206" y2="120" stroke="#e4e4e7" stroke-width="1"/>
      <text x="16" y="138" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Alerta de liquidez: 4 meses</text>
      <text x="16" y="152" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Explicabilidad matemática: 100%</text>
    </g>

    <!-- Bottom Metric Strip inside canvas -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="892" height="48" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="20" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">PILOTOS ACTIVOS: <tspan fill="#09090b" font-weight="600">3 STARTUPS</tspan></text>
      <text x="20" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">EVALUACIÓN VC: <tspan fill="#09090b" font-weight="600">1 FONDO ACTIVO</tspan></text>
      <text x="320" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">GROUND TRUTH: <tspan fill="#09090b" font-weight="600">HISTÓRICO DE RONDAS</tspan></text>
      <text x="320" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">LATENCIA MOTOR: <tspan fill="#09090b" font-weight="600">&lt; 150 MS DETERMINISTA</tspan></text>
      <text x="640" y="22" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">MÉTODO: <tspan fill="#09090b" font-weight="600">IA SIMBÓLICA + DAG</tspan></text>
      <text x="640" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">PROTOTIPO: <tspan fill="#09090b" font-weight="600">TRL 4 VALIDADO</tspan></text>
    </g>
