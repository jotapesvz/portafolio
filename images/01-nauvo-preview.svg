<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid-nauvo" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f4f4f5" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad-engine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="flow-team" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle technical grid -->
  <rect width="1200" height="460" fill="#fafafa"/>
  <rect width="1200" height="460" fill="url(#grid-nauvo)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="38" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="52" cy="19" r="4.5" fill="#10b981" opacity="0.85"/>
  
  <!-- Address Bar -->
  <rect x="80" y="8" width="420" height="22" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="96" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">nauvo.ai / engine / audit-report-0926</text>
  <rect x="1080" y="8" width="102" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="1092" cy="19" r="3" fill="#10b981"/>
  <text x="1102" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#047857">TRL-4 PROD</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="422" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="24" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#09090b">NAUVO</text>
  <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#059669" font-weight="600" letter-spacing="0.5">● COMPOUND AI ENGINE</text>

  <!-- Sidebar Nav items -->
  <rect x="14" y="112" width="192" height="30" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="28" y="132" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#047857">01. Causal Graph (DAG)</text>
  <text x="28" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">02. Macro Nodes</text>
  <text x="28" y="202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">03. Sensitivity Matrix</text>
  <text x="28" y="236" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">04. Liquidity &amp; Runway</text>
  <text x="28" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">05. Audit Logs</text>

  <rect x="14" y="380" width="192" height="60" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="26" y="402" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#09090b">ENGINE CALIBRATION</text>
  <text x="26" y="418" font-family="'JetBrains Mono', monospace" font-size="9" fill="#059669">Parsimony: 100% Valid</text>
  <text x="26" y="430" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Model: Compound DAG+LLM</text>

  <!-- Main Viewport -->
  <!-- Header Bar -->
  <g transform="translate(244, 56)">
    <text x="0" y="18" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#09090b">Inference Graph &amp; Liquidity Propagation</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">Entity extraction via LLM | Deterministic evaluation on acyclic causal graph</text>

    <rect x="800" y="4" width="130" height="26" rx="4" fill="#09090b"/>
    <text x="822" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ffffff">AUDIT REPORT</text>
  </g>

  <!-- DAG Diagram Canvas -->
  <g transform="translate(244, 114)">
    <!-- Canvas Frame -->
    <rect x="0" y="0" width="932" height="326" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Connecting Bezier Curves with Semantic Flow Colors -->
    <!-- Curve 1: Team (Green flow) -->
    <path d="M 220 50 C 310 50, 310 130, 400 130" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Curve 2: Market (Cyan flow) -->
    <path d="M 220 130 C 310 130, 310 130, 400 130" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Curve 3: Runway (Amber flow - warning) -->
    <path d="M 220 210 C 310 210, 310 130, 400 130" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
    
    <!-- Engine Output Curve (Emerald to Verdict) -->
    <path d="M 590 130 C 640 130, 640 130, 690 130" fill="none" stroke="#10b981" stroke-width="2.5"/>

    <!-- Input Node 1: Team (Emerald Safe State) -->
    <g transform="translate(20, 24)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
      <rect x="8" y="8" width="6" height="40" rx="3" fill="#10b981"/>
      <text x="24" y="23" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#047857">NODE 01: EQUIPO &amp; TRACK</text>
      <text x="24" y="43" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#065f46">87.2% <tspan font-size="10" font-weight="500" fill="#059669">· ALTA EJECUCIÓN</tspan></text>
      <circle cx="184" cy="28" r="4.5" fill="#10b981"/>
    </g>

    <!-- Input Node 2: Market (Sky Blue Validated State) -->
    <g transform="translate(20, 104)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <rect x="8" y="8" width="6" height="40" rx="3" fill="#0284c7"/>
      <text x="24" y="23" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#0369a1">NODE 02: MERCADO &amp; MOAT</text>
      <text x="24" y="43" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#075985">72.5% <tspan font-size="10" font-weight="500" fill="#0284c7">· VALIDADO</tspan></text>
      <circle cx="184" cy="28" r="4.5" fill="#0284c7"/>
    </g>

    <!-- Input Node 3: Traction & Runway (Amber Alert State) -->
    <g transform="translate(20, 184)">
      <rect x="0" y="0" width="200" height="56" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
      <rect x="8" y="8" width="6" height="40" rx="3" fill="#f59e0b"/>
      <text x="24" y="23" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#b45309">NODE 03: TRACCIÓN &amp; CAJA</text>
      <text x="24" y="43" font-family="'IBM Plex Sans', sans-serif" font-size="14" font-weight="700" fill="#92400e">4 Meses <tspan font-size="10" font-weight="500" fill="#d97706">⚠ ALERTA RUNWAY</tspan></text>
      <circle cx="184" cy="28" r="4.5" fill="#f59e0b"/>
    </g>

    <!-- Center DAG Engine Node -->
    <g transform="translate(400, 75)">
      <rect x="0" y="0" width="190" height="110" rx="8" fill="url(#grad-engine)" stroke="#3f3f46" stroke-width="1.5"/>
      <rect x="12" y="14" width="76" height="18" rx="3" fill="#27272a"/>
      <text x="18" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#38bdf8">CORE ENGINE</text>
      <text x="14" y="52" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff">DAG Aggregator</text>
      <text x="14" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a1a1aa">Deterministic Weights</text>
      
      <!-- Progress Bar (Emerald fill) -->
      <rect x="14" y="84" width="162" height="6" rx="3" fill="#27272a"/>
      <rect x="14" y="84" width="124" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Final Verdict Card (Emerald Low Risk Container) -->
    <g transform="translate(690, 42)">
      <rect x="0" y="0" width="222" height="176" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="14" y="12" width="126" height="20" rx="4" fill="#dcfce7"/>
      <text x="22" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#15803d">● AUDIT STATUS: PASS</text>
      
      <text x="16" y="66" font-family="'IBM Plex Sans', sans-serif" font-size="38" font-weight="700" fill="#14532d">27.0</text>
      <text x="112" y="58" font-family="'JetBrains Mono', monospace" font-size="12" fill="#166534">/ 100</text>
      <text x="16" y="88" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#15803d">BAJO RIESGO RELATIVO</text>
      <text x="16" y="106" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#166534">Apto para Comité Due Diligence</text>
      
      <line x1="16" y1="122" x2="206" y2="122" stroke="#bbf7d0" stroke-width="1"/>
      <text x="16" y="140" font-family="'JetBrains Mono', monospace" font-size="9" fill="#b45309">⚠ Alerta de liquidez: 4 meses</text>
      <text x="16" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#15803d">✓ Explicabilidad causal: 100%</text>
    </g>

    <!-- Bottom Metric Strip inside canvas -->
    <g transform="translate(20, 260)">
      <rect x="0" y="0" width="892" height="48" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="28" cy="24" r="3" fill="#10b981"/>
      <text x="38" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">PILOTOS: <tspan fill="#047857" font-weight="600">3 STARTUPS ACTIVAS</tspan></text>
      <text x="38" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">EVALUACIÓN: <tspan fill="#09090b" font-weight="600">1 FONDO VC EN VALIDACIÓN</tspan></text>
      
      <text x="320" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">GROUND TRUTH: <tspan fill="#09090b" font-weight="600">HISTÓRICO DE RONDAS</tspan></text>
      <text x="320" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">LATENCIA MOTOR: <tspan fill="#0284c7" font-weight="600">&lt; 150 MS DETERMINISTA</tspan></text>
      
      <text x="640" y="21" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">MÉTODO: <tspan fill="#09090b" font-weight="600">IA SIMBÓLICA + DAG</tspan></text>
      <text x="640" y="36" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">PROTOTIPO: <tspan fill="#047857" font-weight="600">TRL 4 VALIDADO</tspan></text>
    </g>
  </g>
</svg>
