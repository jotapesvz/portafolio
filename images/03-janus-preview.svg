<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid-janus-saas" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f4f4f5" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad-janus-bar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle technical grid -->
  <rect width="1200" height="460" fill="#fafafa"/>
  <rect width="1200" height="460" fill="url(#grid-janus-saas)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="38" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="52" cy="19" r="4.5" fill="#10b981" opacity="0.85"/>
  
  <!-- Address Bar -->
  <rect x="80" y="8" width="460" height="22" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="96" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">janus.udec.cl / catalogo / capacidades-id</text>
  <rect x="1040" y="8" width="142" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="1052" cy="19" r="3" fill="#10b981"/>
  <text x="1062" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#047857">EN PRODUCCIÓN · PÚBLICO</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="422" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="24" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#09090b">JANUS</text>
  <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#059669" font-weight="600" letter-spacing="0.5">● CATÁLOGO I+D UDEC</text>

  <!-- Sidebar Nav items -->
  <rect x="14" y="112" width="192" height="30" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="28" y="132" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#047857">01. Unidades I+D (440+)</text>
  <text x="28" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">02. Servicios I+D (275+)</text>
  <text x="28" y="202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">03. Tecnologías (57+)</text>
  <text x="28" y="236" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">04. Búsqueda por Problema</text>
  <text x="28" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">05. Solicitud Industria</text>

  <rect x="14" y="370" width="192" height="70" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="26" y="392" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#09090b">BASE EN PRODUCCIÓN</text>
  <text x="26" y="410" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#059669">275+ Servicios</text>
  <text x="26" y="426" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">440+ Unidades · 57+ Techs</text>

  <!-- Main Viewport -->
  <g transform="translate(244, 56)">
    <text x="0" y="18" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#09090b">Janus: Catálogo de Capacidades I+D de la Universidad de Concepción</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">Plataforma de dos lados · Traducción de disciplinas académicas a demanda industrial</text>

    <rect x="790" y="4" width="140" height="26" rx="4" fill="#09090b"/>
    <text x="806" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ffffff">JANUS.UDEC.CL ↗</text>
  </g>

  <!-- Platform Dashboard & Two-Sided Translation Architecture -->
  <g transform="translate(244, 114)">
    <rect x="0" y="0" width="932" height="326" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Search & Filter Bar Simulation -->
    <g transform="translate(24, 20)">
      <rect x="0" y="0" width="884" height="42" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="24" cy="21" r="5" fill="none" stroke="#71717a" stroke-width="1.5"/>
      <line x1="28" y1="25" x2="33" y2="30" stroke="#71717a" stroke-width="1.5"/>
      <text x="44" y="25" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#71717a">Buscar por problema industrial o capacidad técnica (ej: biopolímeros, corrosión, visión artificial)...</text>
      <rect x="760" y="8" width="112" height="26" rx="4" fill="#09090b"/>
      <text x="782" y="25" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ffffff">BUSCAR</text>
    </g>

    <!-- Two-Sided Platform Matching Architecture -->
    <g transform="translate(24, 80)">
      <!-- Left: Academic Supply (Oferta Científica) -->
      <rect x="0" y="0" width="270" height="150" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <rect x="14" y="14" width="110" height="18" rx="3" fill="#e0e7ff"/>
      <text x="20" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#3730a3">OFERTA CIENTÍFICA</text>
      <text x="14" y="52" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#09090b">Universidad de Concepción</text>
      <text x="14" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525b">● 440+ Unidades de I+D</text>
      <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525b">● 275+ Servicios catalogados</text>
      <text x="14" y="106" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525b">● 57+ Tecnologías transferibles</text>
      <text x="14" y="130" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#71717a">Lenguaje de facultades y disciplinas</text>

      <!-- Center: Translation Engine (El Trabajo de Producto) -->
      <rect x="290" y="0" width="304" height="150" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <rect x="304" y="14" width="160" height="18" rx="3" fill="#dcfce7"/>
      <text x="312" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#15803d">TRADUCCIÓN DE PRODUCTO</text>
      <text x="304" y="52" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#14532d">Ontología Problema ↔ Solución</text>
      <text x="304" y="72" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#166534">Mapeo del lenguaje de investigación</text>
      <text x="304" y="88" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#166534">a problemas operativos de la industria.</text>
      <rect x="304" y="106" width="276" height="30" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="314" y="125" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#15803d">✓ NAVEGABLE POR NO-ACADÉMICOS</text>

      <!-- Right: Industrial Demand (Demanda Corporativa) -->
      <rect x="614" y="0" width="270" height="150" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <rect x="628" y="14" width="124" height="18" rx="3" fill="#fef3c7"/>
      <text x="634" y="27" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#92400e">DEMANDA INDUSTRIAL</text>
      <text x="628" y="52" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#09090b">Industria Nacional e Int.</text>
      <text x="628" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525b">● Búsqueda por problema real</text>
      <text x="628" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525b">● Filtros por TRL y equipamiento</text>
      <text x="628" y="106" font-family="'JetBrains Mono', monospace" font-size="10" fill="#52525b">● Solicitud directa de vinculación</text>
      <text x="628" y="130" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#71717a">Lenguaje de negocio y operación</text>

      <!-- Connecting arrows -->
      <line x1="270" y1="75" x2="290" y2="75" stroke="#10b981" stroke-width="2"/>
      <polygon points="286,71 292,75 286,79" fill="#10b981"/>
      <line x1="594" y1="75" x2="614" y2="75" stroke="#10b981" stroke-width="2"/>
      <polygon points="610,71 616,75 610,79" fill="#10b981"/>
    </g>

    <!-- Bottom Specs Strip -->
    <g transform="translate(24, 250)">
      <rect x="0" y="0" width="884" height="56" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">URL PÚBLICA: <tspan fill="#059669" font-weight="700">JANUS.UDEC.CL</tspan></text>
      <text x="20" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">TIPO: <tspan fill="#09090b" font-weight="600">PLATAFORMA SAAS DE DOS LADOS</tspan></text>
      <text x="320" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">BASE CATALOGADA: <tspan fill="#0284c7" font-weight="600">440+ UNIDADES · 275+ SERVICIOS</tspan></text>
      <text x="320" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">PORTAFOLIO: <tspan fill="#09090b" font-weight="600">57+ TECNOLOGÍAS COMERCIALIZABLES</tspan></text>
      <text x="650" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">ESTADO: <tspan fill="#059669" font-weight="600">EN PRODUCCIÓN · PÚBLICA</tspan></text>
      <text x="650" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">ROL JP: <tspan fill="#09090b" font-weight="600">PRODUCT MANAGER</tspan></text>
    </g>
  </g>
</svg>
