<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid-janus" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f4f4f5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="460" fill="#fafafa"/>
  <rect width="1200" height="460" fill="url(#grid-janus)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="38" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="20" cy="19" r="4.5" fill="#d4d4d8"/>
  <circle cx="36" cy="19" r="4.5" fill="#d4d4d8"/>
  <circle cx="52" cy="19" r="4.5" fill="#d4d4d8"/>
  
  <rect x="80" y="8" width="460" height="22" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="96" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">janus.biobio.cl / territorial-ecosystem / id3-cidla-masterplan</text>
  <text x="1090" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#a1a1aa">+MMUS$ 150</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="422" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="24" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#09090b">JANUS PLATFORM</text>
  <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a1a1aa" letter-spacing="0.5">DISTRITOS DE INNOVACIÓN</text>

  <rect x="14" y="112" width="192" height="30" rx="4" fill="#e4e4e7"/>
  <text x="28" y="132" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#09090b">01. Masterplan iD3 (6,5 Ha)</text>
  <text x="28" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">02. Centro CIDLA (CMPC)</text>
  <text x="28" y="202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">03. Centro Industria 4.0</text>
  <text x="28" y="236" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">04. Centro Ciencia Datos</text>
  <text x="28" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">05. Modelo Financiero</text>

  <rect x="14" y="360" width="192" height="80" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="26" y="382" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#09090b">EVALUACIÓN ECONÓMICA</text>
  <text x="26" y="400" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#09090b">USD 142M VAN</text>
  <text x="26" y="416" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Tasa Interna: 14,3% TIR</text>
  <text x="26" y="428" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Alianzas: UdeC + CMPC</text>

  <!-- Main Viewport -->
  <g transform="translate(244, 56)">
    <text x="0" y="18" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#09090b">Ecosistema Territorial: Distrito Biobío (iD3) &amp; CIDLA Los Ángeles</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">Co-diseño metodológico Georgia Tech · Vinculación I+D por demanda industrial</text>

    <rect x="790" y="4" width="140" height="26" rx="4" fill="#09090b"/>
    <text x="806" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ffffff">MASTERPLAN APROBADO</text>
  </g>

  <!-- District Blueprint & Tech Transfer Matching Engine -->
  <g transform="translate(244, 114)">
    <rect x="0" y="0" width="932" height="326" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Blueprint: Territorial Zoning Diagram -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="460" height="210" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">ZONIFICACIÓN TERRITORIAL iD3 (6,5 HECTÁREAS)</text>

      <!-- Masterplan Isometric Zones -->
      <rect x="24" y="44" width="180" height="68" rx="4" fill="#ffffff" stroke="#09090b" stroke-width="1.5"/>
      <text x="36" y="66" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="700" fill="#09090b">C4i: Industria 4.0</text>
      <text x="36" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Piloteo de Manufactura Avanzada</text>
      <text x="36" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a1a1aa">Superficie: 2.200 m²</text>

      <rect x="220" y="44" width="216" height="68" rx="4" fill="#ffffff" stroke="#09090b" stroke-width="1.5"/>
      <text x="232" y="66" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="700" fill="#09090b">CDIA: Datos &amp; IA Aplicada</text>
      <text x="232" y="82" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Modelamiento Matemático y GPU Hub</text>
      <text x="232" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a1a1aa">Superficie: 1.850 m²</text>

      <!-- Lower zone -->
      <rect x="24" y="124" width="412" height="70" rx="4" fill="#f4f4f5" stroke="#d4d4d8" stroke-width="1"/>
      <text x="36" y="146" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="700" fill="#09090b">CIDLA Los Ángeles (Alianza UdeC + CMPC)</text>
      <text x="36" y="162" font-family="'JetBrains Mono', monospace" font-size="9" fill="#52525b">Tecnologías de la Madera, Bioproductos y Sensórica Forestal</text>
      <text x="36" y="176" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717a">Co-financiamiento y validación corporativa asegurada</text>
    </g>

    <!-- Right: Janus Matching Engine Matrix -->
    <g transform="translate(504, 24)">
      <rect x="0" y="0" width="404" height="210" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">MOTOR DE EMPAREJAMIENTO (JANUS)</text>

      <!-- Demand Node -->
      <rect x="16" y="44" width="372" height="42" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <text x="28" y="62" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#09090b">DEMANDA CORPORATIVA</text>
      <text x="28" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#52525b">Desafíos reales de celulosa, packaging y logística</text>

      <!-- Causal Link -->
      <line x1="202" y1="86" x2="202" y2="108" stroke="#09090b" stroke-width="1.5"/>

      <!-- Platform Matching Engine -->
      <rect x="16" y="108" width="372" height="42" rx="4" fill="#09090b"/>
      <text x="28" y="126" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#ffffff">PLATAFORMA DIGITAL JANUS</text>
      <text x="28" y="138" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#d4d4d8">Orquestación de I+D, contratos y trazabilidad de PI</text>

      <!-- Supply Node -->
      <line x1="202" y1="150" x2="202" y2="166" stroke="#09090b" stroke-width="1.5"/>
      <rect x="16" y="166" width="372" height="36" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <text x="28" y="184" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#09090b">CAPACIDAD CIENTÍFICA UdeC</text>
      <text x="210" y="184" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717a">MATCH SCORE: 94.8%</text>
    </g>

    <!-- Bottom Specs -->
    <g transform="translate(24, 250)">
      <rect x="0" y="0" width="884" height="56" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">EVALUACIÓN: <tspan fill="#09090b" font-weight="600">VAN USD 142M · 14,3% TIR</tspan></text>
      <text x="20" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">BENCHMARK: <tspan fill="#09090b" font-weight="600">TECH SQUARE ATLANTA (GEORGIA TECH)</tspan></text>
      <text x="340" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">TERRENO: <tspan fill="#09090b" font-weight="600">6,5 HA COSTANERA HUALPÉN</tspan></text>
      <text x="340" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">ALIANZA INDUSTRIAL: <tspan fill="#09090b" font-weight="600">UdeC + CMPC (CIDLA)</tspan></text>
      <text x="640" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">SOFTWARE: <tspan fill="#09090b" font-weight="600">PLATAFORMA JANUS</tspan></text>
      <text x="640" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">ESTADO: <tspan fill="#09090b" font-weight="600">MASTERPLAN APROBADO</tspan></text>
    </g>
  </g>
</svg>
