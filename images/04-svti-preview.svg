<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%" style="background:#ffffff; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <pattern id="grid-svti" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f4f4f5" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad-svti-night" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="100%" stop-color="#020b18"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" fill="#fafafa"/>
  <rect width="1200" height="460" fill="url(#grid-svti)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="38" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="20" cy="19" r="4.5" fill="#ef4444" opacity="0.85"/>
  <circle cx="36" cy="19" r="4.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="52" cy="19" r="4.5" fill="#10b981" opacity="0.85"/>
  
  <rect x="80" y="8" width="460" height="22" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="96" y="23" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">svti.cl / operations / real-time-dispatch / berth-window-08</text>
  <rect x="1080" y="8" width="102" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <circle cx="1092" cy="19" r="3" fill="#10b981"/>
  <text x="1102" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#047857">PORT 24/7</text>

  <!-- Sidebar -->
  <rect x="0" y="38" width="220" height="422" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="24" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="1" fill="#09090b">SVTI OPERATIONS</text>
  <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#2563eb" font-weight="600" letter-spacing="0.5">● MARITIME TERMINAL</text>

  <rect x="14" y="112" width="192" height="30" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="28" y="132" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#1d4ed8">01. Berth Window Control</text>
  <text x="28" y="168" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">02. Yard-to-Quay Dispatch</text>
  <text x="28" y="202" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">03. Demurrage Risk Audit</text>
  <text x="28" y="236" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">04. Stevedoring Shifts</text>
  <text x="28" y="270" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">05. Gate In / Gate Out</text>

  <rect x="14" y="360" width="192" height="80" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="26" y="382" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#09090b">CUMPLIMIENTO SLAs</text>
  <text x="26" y="402" font-family="'IBM Plex Sans', sans-serif" font-size="17" font-weight="700" fill="#059669">100% ZARPE</text>
  <text x="26" y="418" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0284c7" font-weight="600">Demurrage: 0 Penalizaciones</text>
  <text x="26" y="430" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">Operación: Turnos 24/7</text>

  <!-- Main Viewport -->
  <g transform="translate(244, 56)">
    <text x="0" y="18" font-family="'IBM Plex Sans', sans-serif" font-size="15" font-weight="600" fill="#09090b">Control en Tiempo Real de Transferencia de Contenedores y Ventana de Atraque</text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">Monitoreo continuo de lead time entre patio de acopio y grúas de muelle (STS)</text>

    <rect x="800" y="4" width="130" height="26" rx="4" fill="#0284c7"/>
    <text x="814" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ffffff">● VENTANA EN VIVO</text>
  </g>

  <!-- Yard to Berth Sequence Timeline -->
  <g transform="translate(244, 114)">
    <rect x="0" y="0" width="932" height="326" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Operational Flow Gantt / Sequence -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="560" height="210" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">FLUJO DE TRANSFERENCIA: PATIO ➔ MUELLE ➔ NAVE</text>

      <!-- Stage 1: Yard Stacking (Cyan Tone / Container Stacks) -->
      <rect x="16" y="44" width="120" height="136" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
      <text x="26" y="64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0369a1">01. PATIO ACOPIO</text>
      <text x="26" y="78" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#0284c7">Stack A-12 a B-04</text>
      
      <!-- Container Color Tags -->
      <rect x="26" y="92" width="100" height="16" rx="3" fill="#e0f2fe"/>
      <text x="32" y="104" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#0284c7">REEFERS: 42 UNID</text>
      
      <text x="26" y="128" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0369a1">Lead: 12 min</text>
      <text x="26" y="142" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#059669">✓ Sincronizado</text>

      <!-- Arrow 1 (Maritime Blue) -->
      <line x1="144" y1="112" x2="168" y2="112" stroke="#2563eb" stroke-width="2"/>
      <polygon points="164,109 170,112 164,115" fill="#2563eb"/>

      <!-- Stage 2: Transfer Shuttle (Blue Active Flow) -->
      <rect x="174" y="44" width="150" height="136" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
      <text x="184" y="64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#1e40af">02. TRANSPORTE</text>
      <text x="184" y="78" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#1d4ed8">Tractocamiones Muelle</text>
      
      <rect x="184" y="92" width="130" height="16" rx="3" fill="#2563eb"/>
      <text x="190" y="104" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#ffffff">EN TRÁNSITO CONTINUO</text>
      
      <text x="184" y="128" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#059669">Tiempos muertos: -24%</text>
      <text x="184" y="142" font-family="'JetBrains Mono', monospace" font-size="9" fill="#1e40af">Flota: 14 Equipos GPS</text>

      <!-- Arrow 2 (Maritime Blue) -->
      <line x1="332" y1="112" x2="356" y2="112" stroke="#2563eb" stroke-width="2"/>
      <polygon points="352,109 358,112 352,115" fill="#2563eb"/>

      <!-- Stage 3: STS Crane & Vessel (Emerald Berth On-Schedule) -->
      <rect x="362" y="44" width="180" height="136" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="372" y="64" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#15803d">03. GRÚAS STS &amp; NAVE</text>
      <text x="372" y="78" font-family="'IBM Plex Sans', sans-serif" font-size="10" fill="#166534">Grúa STS #02 · Bay 14</text>
      
      <rect x="372" y="92" width="160" height="16" rx="3" fill="#16a34a"/>
      <text x="380" y="104" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#ffffff">ESTIBA FINAL EN NAVE</text>
      
      <text x="372" y="128" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#0369a1">Rendimiento: 28 BMP</text>
      <text x="372" y="142" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#15803d">Ventana Zarpe: EN HORARIO</text>
    </g>

    <!-- Right KPI Cards -->
    <g transform="translate(604, 24)">
      <rect x="0" y="0" width="304" height="210" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#52525b">OBSERVABILIDAD CONTRACTUAL</text>

      <!-- KPI 1: 100% On-Time (Emerald) -->
      <rect x="14" y="38" width="276" height="48" rx="4" fill="#f0fdf4" stroke="#a7f3d0" stroke-width="1.5"/>
      <text x="24" y="56" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#15803d">CUMPLIMIENTO DE VENTANA DE ZARPE</text>
      <text x="24" y="74" font-family="'IBM Plex Sans', sans-serif" font-size="17" font-weight="700" fill="#14532d">100.0% ON-TIME</text>

      <!-- KPI 2: Zero Demurrage (Emerald/Clean) -->
      <rect x="14" y="94" width="276" height="48" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <text x="24" y="112" font-family="'JetBrains Mono', monospace" font-size="9" fill="#71717a">RIESGO DE DEMURRAGE CONTRACTUAL</text>
      <text x="24" y="130" font-family="'IBM Plex Sans', sans-serif" font-size="16" font-weight="700" fill="#047857">USD 0 MULTAS</text>

      <!-- KPI 3: Operational Availability (Naval Dark Gradient) -->
      <rect x="14" y="150" width="276" height="48" rx="4" fill="url(#grad-svti-night)" stroke="#1e3a8a" stroke-width="1.5"/>
      <circle cx="26" cy="168" r="3" fill="#10b981"/>
      <text x="34" y="168" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">SISTEMA ACTIVO 24/7</text>
      <text x="24" y="186" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ffffff">TURNOS CONTINUOS DE ALTO TRÁFICO</text>
    </g>

    <!-- Bottom Specs -->
    <g transform="translate(24, 250)">
      <rect x="0" y="0" width="884" height="56" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="20" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">OPERACIÓN: <tspan fill="#1e40af" font-weight="600">TERMINAL MARÍTIMO DE EXPORTACIÓN</tspan></text>
      <text x="20" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">ENFOQUE: <tspan fill="#09090b" font-weight="600">PRODUCT OPERATIONS &amp; LEAN</tspan></text>
      <text x="340" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">VISIBILIDAD: <tspan fill="#0284c7" font-weight="600">TABLEROS TIEMPO REAL EN MUELLE</tspan></text>
      <text x="340" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">CONTRATOS NAVIERAS: <tspan fill="#059669" font-weight="600">SLA 100% CUMPLIDO</tspan></text>
      <text x="640" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">CONTINUIDAD: <tspan fill="#059669" font-weight="600">24/7 SIN DEMORAS</tspan></text>
      <text x="640" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717a">LEAD TIME: <tspan fill="#0284c7" font-weight="600">REDUCCIÓN SISTEMÁTICA</tspan></text>
    </g>
  </g>
</svg>
